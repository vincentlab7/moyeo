<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모여 - 로그인</title>
<link rel="stylesheet" href="resource/css/font.css">
<link rel="stylesheet" href="resource/css/reset.css">
<link rel="stylesheet" href="resource/css/pc.css">
<link rel="stylesheet" href="resource/css/mobile.css">
</head>
<body>

<div class="phone-frame">

    <!-- 로그인 화면 -->
    <section class="screen is-active" data-screen="login">
        <div class="auth-logo">
            <div class="auth-logo__symbol">
                <svg viewBox="0 0 32 32"><circle cx="12" cy="12" r="4"/><circle cx="22" cy="10" r="3"/><circle cx="22" cy="22" r="3"/><path d="M16 12 L22 10 M16 12 L22 22 M12 16 L22 22" stroke="#fff" stroke-width="1.5" fill="none"/></svg>
            </div>
            <div class="auth-logo__name">모여</div>
            <div class="auth-logo__desc">우리 그룹의 일정을 한곳에</div>
        </div>

        <p class="form-error" data-google-error role="alert"></p>

        <button class="btn-social btn-social--google" data-google-login>
            <div class="btn-social__icon" style="background:#ffffff; border:1px solid #e0e0e0; font-size:13px; font-weight:900; color:#4285F4;">G</div>
            Google로 시작하기
        </button>

        <p class="auth-footer" style="color:#c4c9d2; font-size:12px; padding-top:20px; padding-bottom:0;">로그인 시 서비스 이용약관 및 개인정보 처리방침에 동의합니다.</p>
    </section>

    <!-- 그룹 생성 화면 (신규 사용자 전용) -->
    <section class="screen" data-screen="group">
        <div style="padding-top:28px;">
            <h2 style="font-size:22px; font-weight:700; color:#111; letter-spacing:-0.5px; margin-bottom:4px;">첫 번째 그룹을 만들어요</h2>
            <p style="font-size:14px; color:#888; margin-bottom:28px;">나중에 더 만들거나 참여할 수 있어요</p>

            <div class="form-group">
                <label class="form-label">그룹 유형</label>
                <div class="group-type-grid">
                    <div class="group-type-item is-selected">
                        <span class="group-type-item__emoji">👨‍👩‍👧‍👦</span>
                        <span class="group-type-item__label">가족</span>
                    </div>
                    <div class="group-type-item">
                        <span class="group-type-item__emoji">💑</span>
                        <span class="group-type-item__label">커플</span>
                    </div>
                    <div class="group-type-item">
                        <span class="group-type-item__emoji">💼</span>
                        <span class="group-type-item__label">회사팀</span>
                    </div>
                    <div class="group-type-item">
                        <span class="group-type-item__emoji">🎯</span>
                        <span class="group-type-item__label">프로젝트</span>
                    </div>
                    <div class="group-type-item">
                        <span class="group-type-item__emoji">📚</span>
                        <span class="group-type-item__label">스터디</span>
                    </div>
                    <div class="group-type-item">
                        <span class="group-type-item__emoji">🎉</span>
                        <span class="group-type-item__label">동아리</span>
                    </div>
                    <div class="group-type-item">
                        <span class="group-type-item__emoji">✨</span>
                        <span class="group-type-item__label">기타</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="group-name">그룹 이름</label>
                <input class="form-input" id="group-name" type="text" placeholder="예: 우리 가족, 마케팅팀">
            </div>

            <button class="btn-primary" data-create-group>그룹 만들고 시작하기</button>
            <p style="text-align:center; padding:16px 0 32px;">
                <span style="font-size:13px; color:#888;">이미 초대코드가 있어요 → </span>
                <a href="#" data-join-code style="font-size:13px; color:#111; font-weight:600; text-decoration:none;">코드 입력하기</a>
            </p>
        </div>
    </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="resource/js/firebase-config.js"></script>
<script src="resource/js/auth.js"></script>
<script src="resource/js/db.js"></script>
<script src="resource/js/main.js"></script>
<script>
/* ── 화면 전환 헬퍼 ── */
function _showScreen(name) {
    document.querySelectorAll('.screen').forEach(function (s) {
        s.classList.toggle('is-active', s.dataset.screen === name);
    });
}

/* ── auth.js 콜백: 그룹 있는 기존 사용자 → 홈으로 ── */
function onGroupLoaded() {
    location.href = 'app.html';
}

/* ── auth.js 콜백: 그룹 없는 신규 사용자 → 그룹 생성 화면으로 ── */
function onGroupRequired() {
    _showScreen('group');
}

document.addEventListener('DOMContentLoaded', function () {

    /* Google 로그인 */
    var googleBtn = document.querySelector('[data-google-login]');
    if (googleBtn) {
        googleBtn.addEventListener('click', function () {
            if (typeof window.signInWithGoogle === 'function') window.signInWithGoogle();
        });
    }

    /* 그룹 유형 선택 */
    document.addEventListener('click', function (e) {
        var item = e.target.closest('.group-type-item');
        if (!item) return;
        document.querySelectorAll('.group-type-item').forEach(function (el) {
            el.classList.remove('is-selected');
        });
        item.classList.add('is-selected');
    });

    /* 그룹 만들기 */
    var createBtn = document.querySelector('[data-create-group]');
    if (createBtn) {
        createBtn.addEventListener('click', function () {
            var nameInput = document.getElementById('group-name');
            var name = nameInput ? nameInput.value.trim() : '';
            name = name || '우리 그룹';
            var emojiEl = document.querySelector('.group-type-item.is-selected .group-type-item__emoji');
            var emoji = emojiEl ? emojiEl.textContent.trim() : '👨‍👩‍👧‍👦';
            createBtn.disabled = true;
            createBtn.textContent = '생성 중...';
            if (IS_FIREBASE_READY && typeof window.createGroup === 'function') {
                window.createGroup(name, emoji).catch(function (err) {
                    createBtn.disabled = false;
                    createBtn.textContent = '그룹 만들고 시작하기';
                    alert(err.message || '그룹 생성에 실패했습니다.');
                });
            } else {
                location.href = 'app.html';
            }
        });
    }

    /* 초대 코드로 참여 */
    var joinLink = document.querySelector('[data-join-code]');
    if (joinLink) {
        joinLink.addEventListener('click', function (e) {
            e.preventDefault();
            if (!IS_FIREBASE_READY) { location.href = 'app.html'; return; }
            var code = window.prompt('초대 코드를 입력해주세요 (예: FMLY8392)');
            if (!code) return;
            window.joinGroup(code).catch(function (err) {
                alert(err.message || '그룹 참여에 실패했습니다.');
            });
        });
    }

});
</script>
</body>
</html>
