<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모여 - 할일</title>
<link rel="stylesheet" href="resource/css/font.css">
<link rel="stylesheet" href="resource/css/reset.css">
<link rel="stylesheet" href="resource/css/pc.css">
<link rel="stylesheet" href="resource/css/mobile.css">
</head>
<body>

<div class="phone-frame">
  <div class="page-loading" id="page-loading"><div class="page-loading__spinner"></div></div>

  <!-- 할일 메인 화면 (그룹/개인 탭 포함) -->
  <div class="screen-wrap is-active" data-screen-wrap="todo-main">

    <header class="header" style="flex-direction:column; align-items:stretch; padding-bottom:0;">
      <div class="header__top" style="display:flex; align-items:center; justify-content:space-between; padding-bottom:12px;">
        <div class="header__title">할일</div>
        <button class="header__btn" aria-label="필터"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="17" y2="18"/></svg></button>
      </div>
      <div class="segment" role="tablist">
        <button class="segment__tab is-active" role="tab" aria-selected="true" data-todo="group">그룹 할일</button>
        <button class="segment__tab" role="tab" aria-selected="false" data-todo="personal">내 할일</button>
      </div>
    </header>

    <section class="scroll-area">

      <!-- 그룹 할일 콘텐츠 -->
      <div data-todo-content="group">
        <div class="progress-summary">
          <div class="progress-summary__top">
            <div class="progress-summary__label">우리 가족 할일</div>
            <div class="progress-summary__count"><span>2</span> / 5 완료</div>
          </div>
          <div class="progress-bar"><div class="progress-bar__fill" style="width: 40%;"></div></div>
        </div>

        <section class="status-group">
          <div class="status-group__header">
            <div class="status-group__label"><div class="status-group__label-dot" style="background:#c4c9d2;"></div>진행전</div>
            <div class="status-group__count">2</div>
          </div>
          <article class="todo-card">
            <div class="todo-card__check"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top">
                <div class="todo-card__title">여행 숙소 예약</div>
                <button class="todo-card__more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/><circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg></button>
              </div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--group">그룹</div>
                <div class="todo-card__assignee"><div class="todo-card__assignee-avatar" style="background:#4f7cff;">아</div><div class="todo-card__assignee-name">아빠</div></div>
              </div>
            </div>
          </article>
          <article class="todo-card">
            <div class="todo-card__check"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top">
                <div class="todo-card__title">자동차 정기 점검 예약</div>
                <button class="todo-card__more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/><circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg></button>
              </div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--group">그룹</div>
                <div class="todo-card__assignee"><div class="todo-card__assignee-avatar" style="background:#f97316;">엄</div><div class="todo-card__assignee-name">엄마</div></div>
              </div>
            </div>
          </article>
        </section>

        <section class="status-group">
          <div class="status-group__header">
            <div class="status-group__label"><div class="status-group__label-dot" style="background:#f59e0b;"></div>진행중</div>
            <div class="status-group__count">1</div>
          </div>
          <article class="todo-card">
            <div class="todo-card__check is-doing"></div>
            <div class="todo-card__body">
              <div class="todo-card__top">
                <div class="todo-card__title">에어컨 필터 교체</div>
                <button class="todo-card__more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/><circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg></button>
              </div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--group">그룹</div>
                <div class="todo-badge todo-badge--doing">진행중</div>
                <div class="todo-card__assignee"><div class="todo-card__assignee-avatar" style="background:#4f7cff;">아</div><div class="todo-card__assignee-name">아빠</div></div>
              </div>
            </div>
          </article>
        </section>

        <section class="status-group">
          <div class="status-group__header">
            <div class="status-group__label"><div class="status-group__label-dot" style="background:#10b981;"></div>완료</div>
            <div class="status-group__count">2</div>
          </div>
          <article class="todo-card" style="opacity:0.6;">
            <div class="todo-card__check is-done"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top"><div class="todo-card__title is-done">장보기</div></div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--group">그룹</div>
                <div class="todo-badge todo-badge--done">완료</div>
                <div class="todo-card__assignee"><div class="todo-card__assignee-avatar" style="background:#f97316;">엄</div><div class="todo-card__assignee-name">엄마</div></div>
              </div>
            </div>
          </article>
          <article class="todo-card" style="opacity:0.6;">
            <div class="todo-card__check is-done"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top"><div class="todo-card__title is-done">인터넷 요금제 변경</div></div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--group">그룹</div>
                <div class="todo-badge todo-badge--done">완료</div>
                <div class="todo-card__assignee"><div class="todo-card__assignee-avatar" style="background:#4f7cff;">아</div><div class="todo-card__assignee-name">아빠</div></div>
              </div>
            </div>
          </article>
        </section>
      </div>

      <!-- 내 할일 콘텐츠 (기본 숨김) -->
      <div data-todo-content="personal" style="display:none;">
        <div class="progress-summary">
          <div class="progress-summary__top">
            <div class="progress-summary__label">내 할일</div>
            <div class="progress-summary__count"><span>1</span> / 4 완료</div>
          </div>
          <div class="progress-bar"><div class="progress-bar__fill" style="width: 25%;"></div></div>
        </div>

        <section class="status-group">
          <div class="status-group__header">
            <div class="status-group__label"><div class="status-group__label-dot" style="background:#c4c9d2;"></div>진행전</div>
            <div class="status-group__count">2</div>
          </div>
          <article class="todo-card">
            <div class="todo-card__check"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top">
                <div class="todo-card__title">병원 예약</div>
                <button class="todo-card__more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/><circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg></button>
              </div>
              <div class="todo-card__meta"><div class="todo-badge todo-badge--personal">개인</div></div>
            </div>
          </article>
          <article class="todo-card">
            <div class="todo-card__check"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top">
                <div class="todo-card__title">운전면허 갱신 서류 준비</div>
                <button class="todo-card__more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/><circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg></button>
              </div>
              <div class="todo-card__meta"><div class="todo-badge todo-badge--personal">개인</div></div>
            </div>
          </article>
        </section>

        <section class="status-group">
          <div class="status-group__header">
            <div class="status-group__label"><div class="status-group__label-dot" style="background:#f59e0b;"></div>진행중</div>
            <div class="status-group__count">1</div>
          </div>
          <article class="todo-card">
            <div class="todo-card__check is-doing"></div>
            <div class="todo-card__body">
              <div class="todo-card__top">
                <div class="todo-card__title">발표 자료 준비</div>
                <button class="todo-card__more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/><circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg></button>
              </div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--personal">개인</div>
                <div class="todo-badge todo-badge--doing">진행중</div>
              </div>
            </div>
          </article>
        </section>

        <section class="status-group">
          <div class="status-group__header">
            <div class="status-group__label"><div class="status-group__label-dot" style="background:#10b981;"></div>완료</div>
            <div class="status-group__count">1</div>
          </div>
          <article class="todo-card" style="opacity:0.6;">
            <div class="todo-card__check is-done"><svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg></div>
            <div class="todo-card__body">
              <div class="todo-card__top"><div class="todo-card__title is-done">독서 모임 책 구매</div></div>
              <div class="todo-card__meta">
                <div class="todo-badge todo-badge--personal">개인</div>
                <div class="todo-badge todo-badge--done">완료</div>
              </div>
            </div>
          </article>
        </section>
      </div>

    </section>

    <!-- FAB: 클릭 시 바텀시트 표시 -->
    <button class="fab" aria-label="할일 추가">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <nav class="tabbar" aria-label="하단 탭바">
      <button class="tab-item" data-href="02_home.html"><span class="tab-item__icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="tab-item__label">홈</span></button>
      <button class="tab-item" data-href="03_schedule.html"><span class="tab-item__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="tab-item__label">일정</span></button>
      <button class="tab-item is-active"><span class="tab-item__icon"><svg viewBox="0 0 24 24" stroke="#111"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="tab-item__label" style="color:#111;font-weight:700;">할일</span></button>
      <button class="tab-item" data-href="05_activity.html"><span class="tab-item__icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span><span class="tab-item__label">알림장</span></button>
      <button class="tab-item" data-href="06_myinfo.html"><span class="tab-item__icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="tab-item__label">내정보</span></button>
    </nav>

    <!-- 할일 추가 바텀시트 오버레이 -->
    <aside class="add-sheet-overlay" data-add-sheet role="dialog" aria-modal="true" aria-labelledby="add-sheet-title">
      <div class="add-sheet">
        <div class="add-sheet__handle"></div>
        <header class="add-sheet__header">
          <h2 class="add-sheet__title" id="add-sheet-title">할일 추가</h2>
          <button class="add-sheet__save">저장</button>
        </header>
        <div class="add-sheet__body">
          <input class="add-input" type="text" placeholder="어떤 할일인가요?">
          <div class="add-row">
            <div class="add-row__label"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>종류</div>
            <div class="type-chips">
              <button class="type-chip is-selected">그룹</button>
              <button class="type-chip">개인</button>
            </div>
          </div>
          <div class="add-row">
            <div class="add-row__label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>상태</div>
            <div class="state-chips">
              <button class="state-chip todo is-selected">진행전</button>
              <button class="state-chip doing">진행중</button>
              <button class="state-chip done">완료</button>
            </div>
          </div>
          <div class="add-row">
            <div class="add-row__label"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>담당자</div>
            <div class="assignee-row">
              <button class="assignee-avatar is-selected" style="background:#4f7cff;" title="아빠">아</button>
              <button class="assignee-avatar" style="background:#f97316;" title="엄마">엄</button>
              <button class="assignee-avatar" style="background:#a855f7;" title="딸">딸</button>
              <button class="assignee-avatar" style="background:#10b981;" title="아들">아</button>
            </div>
          </div>
          <div class="add-row add-row--memo">
            <div class="add-row__label"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>메모</div>
            <textarea class="add-memo" placeholder="추가 내용을 입력하세요" rows="2" maxlength="50"></textarea>
          </div>
        </div>
      </div>
    </aside>

    <!-- 담당자 필터 바텀시트 -->
    <aside class="filter-sheet-overlay" data-filter-sheet role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title">
      <div class="filter-sheet">
        <div class="filter-sheet__handle"></div>
        <header class="filter-sheet__header">
          <h2 class="filter-sheet__title" id="filter-sheet-title">담당자 필터</h2>
          <button class="filter-sheet__reset" data-filter-reset>초기화</button>
        </header>
        <div class="filter-sheet__body">
          <div class="filter-assignee-list">
            <button class="filter-assignee-item is-selected" data-filter-assignee="all">
              <div class="filter-assignee-item__avatar filter-assignee-item__avatar--all">전</div>
              <div class="filter-assignee-item__name">전체</div>
            </button>
            <button class="filter-assignee-item" data-filter-assignee="아빠">
              <div class="filter-assignee-item__avatar" style="background:#4f7cff;">아</div>
              <div class="filter-assignee-item__name">아빠</div>
            </button>
            <button class="filter-assignee-item" data-filter-assignee="엄마">
              <div class="filter-assignee-item__avatar" style="background:#f97316;">엄</div>
              <div class="filter-assignee-item__name">엄마</div>
            </button>
            <button class="filter-assignee-item" data-filter-assignee="딸">
              <div class="filter-assignee-item__avatar" style="background:#a855f7;">딸</div>
              <div class="filter-assignee-item__name">딸</div>
            </button>
            <button class="filter-assignee-item" data-filter-assignee="아들">
              <div class="filter-assignee-item__avatar" style="background:#10b981;">아</div>
              <div class="filter-assignee-item__name">아들</div>
            </button>
          </div>
        </div>
        <div class="filter-sheet__footer">
          <button class="filter-sheet__apply" data-filter-apply>적용</button>
        </div>
      </div>
    </aside>

  </div>

  <!-- 할일 카드 더보기 팝오버 메뉴 -->
  <div class="todo-more-menu" data-todo-more-menu role="menu">
    <button class="todo-more-menu__item" data-more-action="edit" role="menuitem">수정하기</button>
    <button class="todo-more-menu__item todo-more-menu__item--danger" data-more-action="delete" role="menuitem">삭제하기</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="resource/js/firebase-config.js"></script>
<script src="resource/js/auth.js"></script>
<script src="resource/js/db.js"></script>
<script src="resource/js/ai.js"></script>
<script src="resource/js/main.js"></script>
<script>
(function () {
  var _gId = '';

  var CHECK_SVG = '<svg viewBox="0 0 12 12"><polyline points="1,6 4.5,10 11,2"/></svg>';

  function _todoCard(t) {
    var isDone   = t.status === 'done';
    var isDoing  = t.status === 'doing';
    var initial  = t.assigneeName ? t.assigneeName.charAt(0) : '?';
    var assigneeColor = t.assigneeColor || '#8B95A1';

    var checkCls = 'todo-card__check' + (isDone ? ' is-done' : isDoing ? ' is-doing' : '');
    var titleCls = 'todo-card__title' + (isDone ? ' is-done' : '');
    var opacity  = isDone ? ' style="opacity:0.6;"' : '';

    var badges = '<div class="todo-badge todo-badge--' + (t.type === 'personal' ? 'personal' : 'group') + '">' +
      (t.type === 'personal' ? '개인' : '그룹') + '</div>';
    if (isDoing) badges += '<div class="todo-badge todo-badge--doing">진행중</div>';
    if (isDone)  badges += '<div class="todo-badge todo-badge--done">완료</div>';

    return '<article class="todo-card"' + opacity + ' data-todo-id="' + t.id + '" data-todo-status="' + t.status + '">' +
      '<div class="' + checkCls + '">' + (isDone || isDoing ? CHECK_SVG : '') + '</div>' +
      '<div class="todo-card__body">' +
        '<div class="todo-card__top">' +
          '<div class="' + titleCls + '">' + t.title + '</div>' +
          '<button class="todo-card__more" aria-label="더보기">' +
            '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="#c4c9d2"/>' +
            '<circle cx="12" cy="12" r="1" fill="#c4c9d2"/><circle cx="12" cy="19" r="1" fill="#c4c9d2"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="todo-card__meta">' +
          badges +
          '<div class="todo-card__assignee">' +
            '<div class="todo-card__assignee-avatar" style="background:' + assigneeColor + ';">' + initial + '</div>' +
            '<div class="todo-card__assignee-name">' + (t.assigneeName || '미배정') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function _statusGroup(label, dotColor, statusClass, list) {
    if (!list.length) return '';
    return '<section class="status-group">' +
      '<div class="status-group__header">' +
        '<div class="status-group__label">' +
          '<div class="status-group__label-dot" style="background:' + dotColor + ';"></div>' + label +
        '</div>' +
        '<div class="status-group__count">' + list.length + '</div>' +
      '</div>' +
      list.map(_todoCard).join('') +
    '</section>';
  }

  function _renderGroup(list) {
    var wrap = document.querySelector('[data-todo-content="group"]');
    if (!wrap) return;

    var pending = list.filter(function (t) { return t.status === 'pending' || !t.status; });
    var doing   = list.filter(function (t) { return t.status === 'doing'; });
    var done    = list.filter(function (t) { return t.status === 'done'; });
    var total   = list.length;
    var doneN   = done.length;

    /* 진행도 */
    var pct = total ? Math.round((doneN / total) * 100) : 0;
    var summary = wrap.querySelector('.progress-summary');
    if (summary) {
      summary.querySelector('.progress-summary__count').innerHTML = '<span>' + doneN + '</span> / ' + total + ' 완료';
      summary.querySelector('.progress-bar__fill').style.width = pct + '%';
    }

    /* 기존 status-group 제거 후 재렌더 */
    wrap.querySelectorAll('.status-group').forEach(function (el) { el.remove(); });

    wrap.insertAdjacentHTML('beforeend',
      _statusGroup('진행전', '#c4c9d2', 'pending', pending) +
      _statusGroup('진행중', '#f59e0b', 'doing', doing) +
      _statusGroup('완료',   '#10b981', 'done', done)
    );
  }

  function _renderPersonal(list) {
    var wrap = document.querySelector('[data-todo-content="personal"]');
    if (!wrap) return;
    wrap.querySelectorAll('.status-group').forEach(function (el) { el.remove(); });
    if (!list.length) {
      var old = wrap.querySelector('.todo-empty');
      if (!old) wrap.insertAdjacentHTML('beforeend',
        '<div class="todo-empty" style="padding:32px 0; text-align:center; color:#8B95A1; font-size:14px;">내 할일이 없어요</div>');
      return;
    }
    var pending = list.filter(function (t) { return t.status === 'pending' || !t.status; });
    var doing   = list.filter(function (t) { return t.status === 'doing'; });
    var done    = list.filter(function (t) { return t.status === 'done'; });
    wrap.insertAdjacentHTML('beforeend',
      _statusGroup('진행전', '#c4c9d2', 'pending', pending) +
      _statusGroup('진행중', '#f59e0b', 'doing', doing) +
      _statusGroup('완료',   '#10b981', 'done', done)
    );
  }

  /* 체크 버튼 클릭 → 상태 순환 (pending → doing → done → pending) */
  document.addEventListener('click', function (e) {
    var check = e.target.closest('.todo-card__check');
    if (!check || !_gId) return;
    var card = check.closest('[data-todo-id]');
    if (!card) return;
    var tid = card.dataset.todoId;
    var cur = card.dataset.todoStatus || 'pending';
    var next = cur === 'done' ? 'pending' : 'done';
    window.updateTodo(_gId, tid, { status: next });
  });

  window.onGroupLoaded = function (group) {
    _gId = group.id;
    var myUid = window._myProfile ? window._myProfile.uid : null;

    window.onTodos(group.id, function (list) {
      var groupList    = list.filter(function (t) { return t.type !== 'personal'; });
      var personalList = list.filter(function (t) { return t.type === 'personal' && t.createdBy === myUid; });
      _renderGroup(groupList);
      _renderPersonal(personalList);
    });
  };
}());
</script>
</body>
</html>
